name: Resolve and Submit App Review

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve rejected item and submit
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyjwt requests cryptography -q
          .venv/bin/python <<'PY'
          import base64
          import os
          import time

          import jwt
          import requests

          APP_ID = "6777088642"
          VERSION_ID = "7fa5b5b8-eb84-49ca-9e63-7b88fb89554a"
          KEY_ID = "WDXGY9WX55"
          ISSUER_ID = "2be0734f-943a-4d61-9dc9-5d9045c46fec"

          key = base64.b64decode(os.environ["ASC_API_KEY_BASE64"]).decode("utf-8")
          token = jwt.encode(
              {
                  "iss": ISSUER_ID,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 900,
                  "aud": "appstoreconnect-v1",
              },
              key,
              algorithm="ES256",
              headers={"kid": KEY_ID},
          )
          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          })

          def request(method, path, body=None, ok=(200, 201, 204), optional=False):
              response = session.request(
                  method,
                  "https://api.appstoreconnect.apple.com" + path,
                  json=body,
                  timeout=30,
              )
              print(f"\n{method} {path} -> {response.status_code}")
              if response.text:
                  print(response.text[:4000])
              if response.status_code not in ok and not optional:
                  raise SystemExit(1)
              return response

          def get_json(path, params=None):
              response = session.get(
                  "https://api.appstoreconnect.apple.com" + path,
                  params=params,
                  timeout=30,
              )
              print(f"\nGET {path} -> {response.status_code}")
              if response.text:
                  print(response.text[:4000])
              response.raise_for_status()
              return response.json()

          def find_submissions():
              return get_json(
                  f"/v1/apps/{APP_ID}/reviewSubmissions",
                  {
                      "limit": "20",
                      "include": "items,appStoreVersionForReview",
                      "fields[reviewSubmissions]": "platform,submittedDate,state,items,appStoreVersionForReview",
                      "fields[reviewSubmissionItems]": "state,appStoreVersion",
                      "fields[appStoreVersions]": "versionString,appStoreState,appVersionState",
                  },
              )

          def submit_review(submission_id):
              payload = {
                  "data": {
                      "type": "reviewSubmissions",
                      "id": submission_id,
                      "attributes": {"submitted": True},
                  }
              }
              for attempt in range(1, 8):
                  response = request(
                      "PATCH",
                      f"/v1/reviewSubmissions/{submission_id}",
                      payload,
                      optional=True,
                  )
                  if response.status_code in (200, 201, 204):
                      print("Submitted for review.")
                      return True
                  if response.status_code == 409 and "try again later" in response.text:
                      time.sleep(60)
                      continue
                  return False
              return False

          payload = find_submissions()
          included = {item["id"]: item for item in payload.get("included", [])}
          unresolved_id = None
          rejected_item_id = None
          ready_empty_id = None

          for submission in payload.get("data", []):
              attrs = submission.get("attributes", {})
              rels = submission.get("relationships", {})
              if attrs.get("state") == "READY_FOR_REVIEW":
                  items = rels.get("items", {}).get("data", [])
                  if not items and not ready_empty_id:
                      ready_empty_id = submission["id"]
              if attrs.get("state") == "UNRESOLVED_ISSUES":
                  app_version = rels.get("appStoreVersionForReview", {}).get("data")
                  if app_version and app_version.get("id") == VERSION_ID:
                      unresolved_id = submission["id"]
                      for item_link in rels.get("items", {}).get("data", []):
                          item = included.get(item_link["id"], {})
                          if item.get("attributes", {}).get("state") == "REJECTED":
                              rejected_item_id = item_link["id"]

          print(f"unresolved_id={unresolved_id}")
          print(f"rejected_item_id={rejected_item_id}")
          print(f"ready_empty_id={ready_empty_id}")

          if unresolved_id and rejected_item_id:
              body = {
                  "data": {
                      "type": "reviewSubmissionItems",
                      "id": rejected_item_id,
                      "attributes": {"state": "READY_FOR_REVIEW"},
                  }
              }
              update = request(
                  "PATCH",
                  f"/v1/reviewSubmissionItems/{rejected_item_id}",
                  body,
                  optional=True,
              )
              if update.status_code in (200, 201, 204) and submit_review(unresolved_id):
                  raise SystemExit(0)

              print("Direct item update did not work. Removing rejected item and creating a fresh submission item.")
              delete = request(
                  "DELETE",
                  f"/v1/reviewSubmissionItems/{rejected_item_id}",
                  ok=(204,),
                  optional=True,
              )
              if delete.status_code not in (204, 404):
                  raise SystemExit(1)

          if not ready_empty_id:
              created = request(
                  "POST",
                  "/v1/reviewSubmissions",
                  {
                      "data": {
                          "type": "reviewSubmissions",
                          "attributes": {"platform": "IOS"},
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": APP_ID}}
                          },
                      }
                  },
                  ok=(201,),
              ).json()
              ready_empty_id = created["data"]["id"]

          create_item = request(
              "POST",
              "/v1/reviewSubmissionItems",
              {
                  "data": {
                      "type": "reviewSubmissionItems",
                      "relationships": {
                          "appStoreVersion": {
                              "data": {"type": "appStoreVersions", "id": VERSION_ID}
                          },
                          "reviewSubmission": {
                              "data": {"type": "reviewSubmissions", "id": ready_empty_id}
                          },
                      },
                  }
              },
              ok=(201,),
          )
          item_id = create_item.json()["data"]["id"]
          print(f"Created review submission item {item_id}")

          if submit_review(ready_empty_id):
              raise SystemExit(0)
          raise SystemExit(1)
          PY
