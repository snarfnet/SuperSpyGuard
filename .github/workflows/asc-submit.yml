name: Submit to App Review

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "/Applications/$XCODE_APP"
          else XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1); sudo xcode-select -s "/Applications/$XCODE_APP"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Capture App Store screenshots
        run: |
          set -euo pipefail
          mkdir -p screenshots
          python3 -m venv screenshot-venv
          screenshot-venv/bin/pip install pillow -q
          screenshot-venv/bin/python scripts/generate_app_store_screenshots.py
          file screenshots/iphone65.png
          file screenshots/ipad129.png
          exit 0
          screenshot-venv/bin/python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          icon = Image.open("SuperSpyGuard/Assets.xcassets/AppIcon.appiconset/icon_1024.png").convert("RGB")
          out_dir = Path("screenshots")
          out_dir.mkdir(exist_ok=True)

          def font(size, bold=False):
              candidates = [
                  "/System/Library/Fonts/ヒラギノ角ゴシック W6.ttc" if bold else "/System/Library/Fonts/ヒラギノ角ゴシック W3.ttc",
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf" if bold else "/System/Library/Fonts/Supplemental/Arial.ttf",
              ]
              for path in candidates:
                  try:
                      return ImageFont.truetype(path, size)
                  except Exception:
                      pass
              return ImageFont.load_default()

          def draw_wrapped(draw, text, xy, max_width, fill, fnt, line_gap=14):
              x, y = xy
              lines = []
              current = ""
              for ch in text:
                  trial = current + ch
                  if draw.textbbox((0, 0), trial, font=fnt)[2] <= max_width or not current:
                      current = trial
                  else:
                      lines.append(current)
                      current = ch
              if current:
                  lines.append(current)
              for line in lines:
                  draw.text((x, y), line, font=fnt, fill=fill)
                  y += draw.textbbox((0, 0), line, font=fnt)[3] + line_gap
              return y

          def make(path, size):
              w, h = size
              base = Image.new("RGB", size, (5, 8, 16))
              glow = Image.new("RGB", size, (0, 0, 0))
              gd = ImageDraw.Draw(glow)
              for i in range(18):
                  color = (0, 110 + i * 5, 180 + i * 3)
                  gd.ellipse((w * .12 - i * 18, h * .08 - i * 18, w * .88 + i * 18, h * .52 + i * 18), outline=color, width=4)
              glow = glow.filter(ImageFilter.GaussianBlur(8))
              base = Image.blend(base, glow, .55)
              d = ImageDraw.Draw(base)

              margin = int(w * .09)
              title_font = font(int(w * .072), True)
              sub_font = font(int(w * .036))
              item_font = font(int(w * .034), True)
              small_font = font(int(w * .027))

              icon_size = int(w * .46)
              icon_img = icon.resize((icon_size, icon_size), Image.Resampling.LANCZOS)
              icon_x = (w - icon_size) // 2
              icon_y = int(h * .08)
              base.paste(icon_img, (icon_x, icon_y))

              y = icon_y + icon_size + int(h * .055)
              title = "Super Spy Guard"
              tw = d.textbbox((0, 0), title, font=title_font)[2]
              d.text(((w - tw) // 2, y), title, font=title_font, fill=(235, 248, 255))
              y += int(h * .075)
              y = draw_wrapped(d, "ホテルや自宅で気になる場所をすばやくチェック", (margin, y), w - margin * 2, (166, 230, 255), sub_font, int(h * .008))

              features = [
                  ("カメラ反射チェック", "フラッシュでレンズらしい光を探します"),
                  ("周辺デバイス確認", "Wi-FiとBluetooth機器を一覧で確認"),
                  ("点検リストと履歴", "部屋の確認手順とPDFレポートを保存"),
              ]
              y += int(h * .045)
              for heading, body in features:
                  d.rounded_rectangle((margin, y, w - margin, y + int(h * .105)), radius=24, fill=(14, 30, 46), outline=(0, 210, 255), width=2)
                  d.text((margin + 34, y + 20), heading, font=item_font, fill=(255, 255, 255))
                  d.text((margin + 34, y + 20 + int(w * .045)), body, font=small_font, fill=(170, 194, 210))
                  y += int(h * .125)

              d.text((margin, h - int(h * .075)), "安全確認を補助する防犯ツール", font=small_font, fill=(125, 210, 165))
              base.save(path, "PNG", optimize=True)

          make(out_dir / "iphone65.png", (1242, 2688))
          make(out_dir / "ipad129.png", (2048, 2732))
          PY
          file screenshots/iphone65.png
          file screenshots/ipad129.png

      - name: Prepare and submit App Store version
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyjwt requests cryptography -q
          .venv/bin/python <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import time

          import jwt
          import requests

          APP_ID = "6777088642"
          VERSION_ID = "7fa5b5b8-eb84-49ca-9e63-7b88fb89554a"
          LOCALIZATION_ID = "96a5d76b-55ed-40a5-ae4e-a02db1062454"
          BUILD_ID = "e53c67a6-f93f-4030-b122-56561c5b18d9"
          JPN_500_PRICE_POINT_ID = "eyJzIjoiNjc3NzA4ODY0MiIsInQiOiJKUE4iLCJwIjoiMTAwNDYifQ"
          PRIVACY_POLICY_URL = "https://snarfnet.github.io/SuperSpyGuard/privacy.html"
          SUPPORT_URL = "https://snarfnet.github.io/SuperSpyGuard/support.html"
          KEY_ID = "WDXGY9WX55"
          ISSUER_ID = "2be0734f-943a-4d61-9dc9-5d9045c46fec"

          key = base64.b64decode(os.environ["ASC_API_KEY_BASE64"]).decode("utf-8")
          token = jwt.encode(
              {
                  "iss": ISSUER_ID,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              key,
              algorithm="ES256",
              headers={"kid": KEY_ID},
          )
          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          })

          def request(method, path, body=None, ok=(200, 201, 204), optional=False):
              url = "https://api.appstoreconnect.apple.com" + path
              r = session.request(method, url, json=body, timeout=30)
              print(f"\n{method} {path} -> {r.status_code}")
              if r.text:
                  print(r.text[:4000])
              if r.status_code not in ok and not optional:
                  raise SystemExit(1)
              if r.text:
                  return r.json()
              return {}

          def get(path, params=None, ok=(200,)):
              url = "https://api.appstoreconnect.apple.com" + path
              r = session.get(url, params=params, timeout=30)
              print(f"\nGET {path} -> {r.status_code}")
              if r.text:
                  print(r.text[:2000])
              if r.status_code not in ok:
                  raise SystemExit(1)
              return r.json() if r.text else {}

          def upload_screenshot(display_type, file_path):
              payload = get(
                  f"/v1/appStoreVersionLocalizations/{LOCALIZATION_ID}/appScreenshotSets",
                  {"limit": "50", "fields[appScreenshotSets]": "screenshotDisplayType"},
              )
              set_id = None
              for item in payload.get("data", []):
                  if item.get("attributes", {}).get("screenshotDisplayType") == display_type:
                      set_id = item["id"]
                      break
              if not set_id:
                  created = request("POST", "/v1/appScreenshotSets", {
                      "data": {
                          "type": "appScreenshotSets",
                          "attributes": {"screenshotDisplayType": display_type},
                          "relationships": {
                              "appStoreVersionLocalization": {
                                  "data": {"type": "appStoreVersionLocalizations", "id": LOCALIZATION_ID}
                              }
                          },
                      }
                  }, ok=(201,))
                  set_id = created["data"]["id"]

              existing = get(
                  f"/v1/appScreenshotSets/{set_id}/appScreenshots",
                  {"limit": "50", "fields[appScreenshots]": "fileName"},
              )
              for item in existing.get("data", []):
                  request("DELETE", f"/v1/appScreenshots/{item['id']}", ok=(204,), optional=True)

              path = Path(file_path)
              data = path.read_bytes()
              reservation = request("POST", "/v1/appScreenshots", {
                  "data": {
                      "type": "appScreenshots",
                      "attributes": {"fileName": path.name, "fileSize": len(data)},
                      "relationships": {
                          "appScreenshotSet": {
                              "data": {"type": "appScreenshotSets", "id": set_id}
                          }
                      },
                  }
              }, ok=(201,))
              screenshot_id = reservation["data"]["id"]
              operations = reservation["data"]["attributes"]["uploadOperations"]
              for op in operations:
                  chunk = data[op["offset"]:op["offset"] + op["length"]]
                  headers = {h["name"]: h["value"] for h in op.get("requestHeaders", [])}
                  upload = requests.request(op["method"], op["url"], headers=headers, data=chunk, timeout=60)
                  print(f"Upload {display_type} part -> {upload.status_code}")
                  if upload.status_code >= 300:
                      print(upload.text[:1000])
                      raise SystemExit(1)
              request("PATCH", f"/v1/appScreenshots/{screenshot_id}", {
                  "data": {
                      "type": "appScreenshots",
                      "id": screenshot_id,
                      "attributes": {
                          "uploaded": True,
                          "sourceFileChecksum": hashlib.md5(data).hexdigest(),
                      },
                  }
              })

          print("Attach build 107 to version 1.0")
          request("PATCH", f"/v1/appStoreVersions/{VERSION_ID}/relationships/build", {
              "data": {"type": "builds", "id": BUILD_ID}
          }, ok=(200, 204))

          print("Set IDFA and release settings")
          request("PATCH", f"/v1/appStoreVersions/{VERSION_ID}", {
              "data": {
                  "type": "appStoreVersions",
                  "id": VERSION_ID,
                  "attributes": {
                      "usesIdfa": False,
                      "releaseType": "AFTER_APPROVAL",
                  },
              }
          })

          print("Declare no third-party content rights")
          request("PATCH", f"/v1/apps/{APP_ID}", {
              "data": {
                  "type": "apps",
                  "id": APP_ID,
                  "attributes": {
                      "contentRightsDeclaration": "DOES_NOT_USE_THIRD_PARTY_CONTENT"
                  },
              }
          })

          print("Set build export compliance")
          request("PATCH", f"/v1/builds/{BUILD_ID}", {
              "data": {
                  "type": "builds",
                  "id": BUILD_ID,
                  "attributes": {"usesNonExemptEncryption": False},
              }
          }, optional=True)

          print("Set App Store version metadata")
          request("PATCH", f"/v1/appStoreVersions/{VERSION_ID}", {
              "data": {
                  "type": "appStoreVersions",
                  "id": VERSION_ID,
                  "attributes": {"copyright": "2026 Tokyo Nasu"},
              }
          })

          print("Set privacy policy URL")
          app_infos_for_privacy = get(
              f"/v1/apps/{APP_ID}/appInfos",
              {
                  "limit": "10",
                  "include": "appInfoLocalizations",
                  "fields[appInfoLocalizations]": "locale,privacyPolicyUrl",
              },
          )
          app_info_localizations = [
              item for item in app_infos_for_privacy.get("included", [])
              if item.get("type") == "appInfoLocalizations"
          ]
          if not app_info_localizations:
              raise SystemExit("No app info localization found")
          for item in app_info_localizations:
              request("PATCH", f"/v1/appInfoLocalizations/{item['id']}", {
                  "data": {
                      "type": "appInfoLocalizations",
                      "id": item["id"],
                      "attributes": {"privacyPolicyUrl": PRIVACY_POLICY_URL},
                  }
              })

          request("PATCH", f"/v1/appStoreVersionLocalizations/{LOCALIZATION_ID}", {
              "data": {
                  "type": "appStoreVersionLocalizations",
                  "id": LOCALIZATION_ID,
                  "attributes": {
                      "description": "Super Spy Guardは、ホテルや自宅で気になる場所を確認するための防犯チェックアプリです。\n\nカメラの反射チェック、周囲のBluetooth/Wi-Fi機器の確認、音の異常チェック、部屋の点検リストをひとつにまとめました。\n\n主な機能\n- フラッシュ反射チェックでレンズらしい光を探す\n- Bluetooth/Wi-Fi機器を一覧で確認\n- マイク、磁気、光、音のセンサーで周辺をチェック\n- ホテル滞在前の点検ガイド\n- チェック履歴とPDFレポート\n\n本アプリは安全確認の補助ツールです。盗聴器や隠しカメラの発見を保証するものではありません。気になる場合は専門業者への相談も検討してください。",
                      "keywords": "防犯,盗撮,盗聴,カメラ検知,ホテル,旅行,セキュリティ,WiFi,Bluetooth,チェック",
                      "supportUrl": SUPPORT_URL,
                      "marketingUrl": "https://github.com/snarfnet/SuperSpyGuard",
                  },
              }
          })

          print("Create review detail")
          request("POST", "/v1/appStoreReviewDetails", {
              "data": {
                  "type": "appStoreReviewDetails",
                  "attributes": {
                      "contactFirstName": "satoshi",
                      "contactLastName": "amasaki",
                      "contactEmail": "tokyonasu@yahoo.co.jp",
                      "contactPhone": "+81 80 2368 9194",
                      "demoAccountRequired": False,
                      "notes": "ログインは不要です。各タブからスキャン、ツール、履歴、チェックリストを確認できます。センサー権限の許可を求められた場合は許可してテストしてください。",
                  },
                  "relationships": {
                      "appStoreVersion": {"data": {"type": "appStoreVersions", "id": VERSION_ID}}
                  },
              }
          }, ok=(201,), optional=True)
          review_detail = request("GET", f"/v1/appStoreVersions/{VERSION_ID}/appStoreReviewDetail", ok=(200,), optional=True)
          if review_detail.get("data"):
              request("PATCH", f"/v1/appStoreReviewDetails/{review_detail['data']['id']}", {
                  "data": {
                      "type": "appStoreReviewDetails",
                      "id": review_detail["data"]["id"],
                      "attributes": {
                          "contactFirstName": "satoshi",
                          "contactLastName": "amasaki",
                          "contactEmail": "tokyonasu@yahoo.co.jp",
                          "contactPhone": "+81 80 2368 9194",
                          "demoAccountRequired": False,
                          "notes": "ログインは不要です。各タブからスキャン、ツール、履歴、チェックリストを確認できます。センサー権限の許可を求められた場合は許可してテストしてください。",
                      },
                  }
              })

          print("Set age rating declaration")
          app_infos = get(
              f"/v1/apps/{APP_ID}/appInfos",
              {
                  "limit": "10",
                  "include": "ageRatingDeclaration",
                  "fields[appInfos]": "ageRatingDeclaration",
                  "fields[ageRatingDeclarations]": "alcoholTobaccoOrDrugUseOrReferences",
              },
          )
          age_rating_id = None
          for included in app_infos.get("included", []):
              if included.get("type") == "ageRatingDeclarations":
                  age_rating_id = included["id"]
                  break
          if not age_rating_id:
              for info in app_infos.get("data", []):
                  rel = info.get("relationships", {}).get("ageRatingDeclaration", {}).get("data")
                  if rel:
                      age_rating_id = rel["id"]
                      break
          if not age_rating_id:
              raise SystemExit("No age rating declaration found")

          none_rating = {
              "advertising": False,
              "ageAssurance": False,
              "alcoholTobaccoOrDrugUseOrReferences": "NONE",
              "contests": "NONE",
              "gambling": False,
              "gamblingSimulated": "NONE",
              "gunsOrOtherWeapons": "NONE",
              "healthOrWellnessTopics": False,
              "horrorOrFearThemes": "NONE",
              "lootBox": False,
              "matureOrSuggestiveThemes": "NONE",
              "medicalOrTreatmentInformation": "NONE",
              "messagingAndChat": False,
              "parentalControls": False,
              "profanityOrCrudeHumor": "NONE",
              "sexualContentGraphicAndNudity": "NONE",
              "sexualContentOrNudity": "NONE",
              "unrestrictedWebAccess": False,
              "userGeneratedContent": False,
              "violenceCartoonOrFantasy": "NONE",
              "violenceRealistic": "NONE",
              "violenceRealisticProlongedGraphicOrSadistic": "NONE",
          }
          request("PATCH", f"/v1/ageRatingDeclarations/{age_rating_id}", {
              "data": {
                  "type": "ageRatingDeclarations",
                  "id": age_rating_id,
                  "attributes": none_rating,
              }
          })

          print("Upload screenshots")
          upload_screenshot("APP_IPHONE_65", "screenshots/iphone65.png")
          upload_screenshot("APP_IPAD_PRO_3GEN_129", "screenshots/ipad129.png")

          print("Create 500 JPY price schedule")
          request("POST", "/v1/appPriceSchedules", {
              "data": {
                  "type": "appPriceSchedules",
                  "relationships": {
                      "app": {"data": {"type": "apps", "id": APP_ID}},
                      "baseTerritory": {"data": {"type": "territories", "id": "JPN"}},
                      "manualPrices": {"data": [{"type": "appPrices", "id": "${price-jpn-500}"}]},
                  },
              },
              "included": [
                  {
                      "type": "appPrices",
                      "id": "${price-jpn-500}",
                      "attributes": {
                          "manual": True,
                          "startDate": None,
                          "endDate": None,
                      },
                      "relationships": {
                          "appPricePoint": {
                              "data": {"type": "appPricePoints", "id": JPN_500_PRICE_POINT_ID}
                          },
                          "territory": {"data": {"type": "territories", "id": "JPN"}},
                      },
                  }
              ],
          }, ok=(201,), optional=True)

          submission_id = "ea635183-8be8-4e4d-824a-adf11034dd3a"
          print("Reuse unresolved review submission")

          print("Submit for review")
          request("PATCH", f"/v1/reviewSubmissions/{submission_id}", {
              "data": {
                  "type": "reviewSubmissions",
                  "id": submission_id,
                  "attributes": {"submitted": True},
              }
          })
          print("Submitted for review.")
          PY
