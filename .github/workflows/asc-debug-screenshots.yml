name: Debug App Store Screenshots

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query screenshot processing state
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyjwt requests cryptography -q
          .venv/bin/python <<'PY'
          import base64
          import json
          import os
          import time

          import jwt
          import requests

          APP_ID = "6777088642"
          VERSION_ID = "7fa5b5b8-eb84-49ca-9e63-7b88fb89554a"
          LOCALIZATION_ID = "96a5d76b-55ed-40a5-ae4e-a02db1062454"
          KEY_ID = "WDXGY9WX55"
          ISSUER_ID = "2be0734f-943a-4d61-9dc9-5d9045c46fec"

          key = base64.b64decode(os.environ["ASC_API_KEY_BASE64"]).decode("utf-8")
          token = jwt.encode(
              {
                  "iss": ISSUER_ID,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              key,
              algorithm="ES256",
              headers={"kid": KEY_ID},
          )
          session = requests.Session()
          session.headers.update({"Authorization": f"Bearer {token}"})

          def get(path, params=None):
              response = session.get("https://api.appstoreconnect.apple.com" + path, params=params, timeout=30)
              print(f"\nGET {path} -> {response.status_code}")
              print(response.text[:8000])
              response.raise_for_status()
              return response.json()

          get(
              f"/v1/appStoreVersions/{VERSION_ID}",
              {"fields[appStoreVersions]": "appStoreState,appVersionState,versionString,reviewType,releaseType,usesIdfa"},
          )

          sets = get(
              f"/v1/appStoreVersionLocalizations/{LOCALIZATION_ID}/appScreenshotSets",
              {
                  "limit": "50",
                  "fields[appScreenshotSets]": "screenshotDisplayType",
              },
          )

          for screenshot_set in sets.get("data", []):
              display_type = screenshot_set.get("attributes", {}).get("screenshotDisplayType")
              set_id = screenshot_set["id"]
              print(f"\nSCREENSHOT SET {display_type} {set_id}")
              get(
                  f"/v1/appScreenshotSets/{set_id}/appScreenshots",
                  {
                      "limit": "50",
                      "fields[appScreenshots]": "fileName,fileSize,assetDeliveryState,imageAsset",
                  },
              )

          get(
              "/v1/builds",
              {
                  "filter[app]": APP_ID,
                  "limit": "5",
                  "sort": "-uploadedDate",
                  "fields[builds]": "version,uploadedDate,processingState,expired,usesNonExemptEncryption",
              },
          )
          PY
