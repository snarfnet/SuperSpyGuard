name: Resubmit Existing App Review

on:
  workflow_dispatch:

jobs:
  resubmit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resubmit unresolved review submission
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyjwt requests cryptography -q
          .venv/bin/python <<'PY'
          import base64
          import os
          import time

          import jwt
          import requests

          SUBMISSION_ID = "ea635183-8be8-4e4d-824a-adf11034dd3a"
          KEY_ID = "WDXGY9WX55"
          ISSUER_ID = "2be0734f-943a-4d61-9dc9-5d9045c46fec"

          key = base64.b64decode(os.environ["ASC_API_KEY_BASE64"]).decode("utf-8")
          token = jwt.encode(
              {
                  "iss": ISSUER_ID,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1",
              },
              key,
              algorithm="ES256",
              headers={"kid": KEY_ID},
          )
          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          })

          payload = {
              "data": {
                  "type": "reviewSubmissions",
                  "id": SUBMISSION_ID,
                  "attributes": {"submitted": True},
              }
          }

          for attempt in range(1, 11):
              response = session.patch(
                  f"https://api.appstoreconnect.apple.com/v1/reviewSubmissions/{SUBMISSION_ID}",
                  json=payload,
                  timeout=30,
              )
              print(f"Attempt {attempt}: PATCH reviewSubmissions/{SUBMISSION_ID} -> {response.status_code}")
              if response.text:
                  print(response.text[:3000])
              if response.status_code in (200, 201, 204):
                  print("Submitted for review.")
                  raise SystemExit(0)
              if response.status_code == 409 and "try again later" in response.text:
                  time.sleep(60)
                  continue
              raise SystemExit(1)

          raise SystemExit("Review submission was still not ready after retries.")
          PY
