name: Build & Upload to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "/Applications/$XCODE_APP"
        else XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1); sudo xcode-select -s "/Applications/$XCODE_APP"; fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 100 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: [0-9]*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" project.yml

    - name: Generate project
      run: xcodegen generate

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Clean old certificates
      run: |
        python3 -m venv .venv && .venv/bin/pip install pyjwt requests cryptography -q
        .venv/bin/python <<'PY'
        import jwt, os, time, requests
        KEY_ID, ISSUER = 'WDXGY9WX55', '2be0734f-943a-4d61-9dc9-5d9045c46fec'
        key = open(os.path.expanduser('~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8')).read()
        token = jwt.encode({'iss': ISSUER, 'iat': int(time.time()), 'exp': int(time.time())+600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': KEY_ID})
        h = {'Authorization': f'Bearer {token}'}
        deleted = set()
        def cleanup(cert_type, keep):
            r = requests.get(f'https://api.appstoreconnect.apple.com/v1/certificates?limit=200&filter[certificateType]={cert_type}', headers=h, timeout=30)
            if not r.ok: return
            certs = sorted(r.json().get('data',[]), key=lambda c: c['attributes'].get('expirationDate',''))
            for cert in certs[:-keep]:
                if cert['id'] not in deleted:
                    requests.delete(f'https://api.appstoreconnect.apple.com/v1/certificates/{cert["id"]}', headers=h, timeout=30)
                    deleted.add(cert['id'])
        for t in ('IOS_DEVELOPMENT','DEVELOPMENT'): cleanup(t, 1)
        for t in ('IOS_DISTRIBUTION','DISTRIBUTION'): cleanup(t, 2)
        PY

    - name: Build Archive
      run: |
        xcodebuild archive \
          -scheme SuperSpyGuard \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/SuperSpyGuard.xcarchive \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Export IPA
      run: |
        cat > export_options.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>teamID</key><string>83VGKGSQUH</string>
        </dict></plist>
        PLIST
        xcodebuild -exportArchive \
          -archivePath build/SuperSpyGuard.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Upload to ASC
      run: |
        xcrun altool --upload-app \
          -f build/export/SuperSpyGuard.ipa \
          -t ios \
          --apiKey WDXGY9WX55 \
          --apiIssuer 2be0734f-943a-4d61-9dc9-5d9045c46fec
