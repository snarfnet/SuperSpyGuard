name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "/Applications/$XCODE_APP"
        else XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1); sudo xcode-select -s "/Applications/$XCODE_APP"; fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate project
      run: xcodegen generate

    - name: Build
      run: |
        xcodebuild build \
          -scheme SuperSpyGuard \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO
